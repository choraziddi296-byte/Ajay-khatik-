<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>स्कैम रक्षक</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Noto Sans Devanagari', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-6 border border-gray-100">
        <h1 class="text-3xl font-bold text-center text-red-600 mb-1">🛡️ स्कैम रक्षक</h1>
        <p class="text-center text-xs text-gray-500 mb-6 font-medium">आपकी अच्छाई की ढाल - धोखाधड़ी से सुरक्षा</p>
        
        <div class="mb-4">
            <label for="scamInput" class="block font-bold text-gray-700 mb-2">यहाँ संदेश या लिंक पेस्ट करें:</label>
            <textarea id="scamInput" rows="4" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-500 text-sm focus:outline-none" placeholder="उदाहरण: टेलीग्राम पर वीडियो लाइक करके पैसे कमाएं..."></textarea>
        </div>

        <button onclick="checkScam()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl shadow-md mb-4 active:scale-95 transition cursor-pointer">स्कैम की जाँच करें</button>
        <div id="resultBox" class="hidden p-4 rounded-xl mb-4 font-medium text-center shadow-inner border"></div>
        <button id="shareButton" onclick="shareOnWhatsApp()" class="hidden w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-xl shadow-md mb-6 justify-center items-center gap-2 active:scale-95 transition cursor-pointer">🟢 WhatsApp पर सावधान करें</button>

        <div class="bg-amber-50 p-4 rounded-xl border border-amber-200">
            <h3 class="font-bold text-amber-800 mb-2 text-sm">🛡️ सुरक्षा के महामंत्र:</h3>
            <ul class="text-xs text-amber-900 space-y-2 list-decimal list-inside">
                <li>जो नौकरी के नाम पर <span class="text-red-600 font-bold">₹1 भी मांगे</span>, वह 100% स्कैम है।</li>
                <li>कोई भी असली बैंक फोन पर आपका OTP या पासवर्ड नहीं मांगता।</li>
            </ul>
        </div>
    </div>
    <script>
        let globalMessage = "";
        function checkScam() {
            const text = document.getElementById('scamInput').value.trim();
            const lowerText = text.toLowerCase();
            const resultBox = document.getElementById('resultBox');
            const shareButton = document.getElementById('shareButton');
            if (!text) { alert('कृपया कुछ पेस्ट करें!'); return; }
            resultBox.classList.remove('hidden');
            resultBox.className = "p-4 rounded-xl mb-4 font-medium text-center shadow-inner border ";
            const scamKeywords = ['रजिस्ट्रेशन', 'registration', 'फीस', 'fee', 'charge', 'otp', 'ओटीपी', 'पासवर्ड', 'password', 'लाइक', 'like video', 'रोजाना कमाएं', 'earning', 't.me', 'bit.ly', '.apk'];
            let isScam = false;
            scamKeywords.forEach(keyword => { if (lowerText.includes(keyword)) isScam = true; });
            if (isScam) {
                resultBox.innerHTML = "⚠️ <strong>सावधान: यह 100% स्कैम हो सकता है!</strong>";
                resultBox.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
                globalMessage = `🚨 *स्कैम अलर्ट!* 🚨\n\nमुझे एक संदिग्ध फ्रॉड मैसेज मिला है:\n"${text}"\n\nसतर्क रहें! 🛡️`;
                shareButton.classList.remove('hidden');
                shareButton.classList.add('flex');
            } else {
                resultBox.innerHTML = "✅ <strong>यह मैसेज सामान्य लग रहा है।</strong>";
                resultBox.classList.add('bg-green-50', 'text-green-700', 'border-green-200');
                shareButton.classList.add('hidden');
            }
        }
        function shareOnWhatsApp() { if (globalMessage) window.open(`https://whatsapp.com{encodeURIComponent(globalMessage)}`, '_blank'); }
    </script>
</body>
</html>
